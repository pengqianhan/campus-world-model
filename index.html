<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1b25" />
    <meta
      name="description"
      content="{{app.description}}"
    />
    <meta property="og:title" content="{{app.documentTitle}}" />
    <meta
      property="og:description"
      content="{{app.ogDescription}}"
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>{{app.documentTitle}}</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="max-width: 36rem; margin: 20vh auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #14222e">
        {{app.noscript}}
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
